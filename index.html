<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的测试网站</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 60px 50px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 500px;
      width: 90%;
    }
    h1 {
      font-size: 2.5rem;
      color: #667eea;
      margin-bottom: 16px;
    }
    p {
      font-size: 1.1rem;
      color: #666;
      line-height: 1.8;
      margin-bottom: 12px;
    }
    .emoji {
      font-size: 4rem;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 14px 36px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
    }
    .counter {
      font-size: 3rem;
      font-weight: bold;
      color: #764ba2;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">&#x1F680;</div>
    <h1>网站部署成功</h1>
    <p>这是一个使用 GitHub Pages 部署的测试网站。</p>
    <p>点击下方按钮计数：</p>
    <div class="counter" id="counter">0</div>
    <button class="btn" onclick="increment()">点击我</button>
    <p style="margin-top: 30px; font-size: 0.8rem; color: #aaa;">
      MonkeyCode AI Development Platform
    </p>
  </div>

  <script>
    let count = 0;
    function increment() {
      count++;
      document.getElementById('counter').textContent = count;
    }
  </script>
</body>
</html>
