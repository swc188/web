<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build Your Own X</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      line-height: 1.6;
    }
    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .header-inner h1 {
      font-size: 1.3rem;
      background: linear-gradient(135deg, #58a6ff, #bc8cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
    }
    .lang-switch {
      display: flex;
      border: 1px solid #30363d;
      border-radius: 6px;
      overflow: hidden;
      font-size: 0.8rem;
    }
    .lang-switch button {
      background: transparent;
      color: #8b949e;
      border: none;
      padding: 4px 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-switch button.active {
      background: #1f6feb;
      color: #fff;
    }
    .lang-switch button:hover:not(.active) { color: #c9d1d9; }
    .header-inner a.gh-link {
      color: #8b949e;
      text-decoration: none;
      font-size: 0.85rem;
    }
    .header-inner a.gh-link:hover { color: #58a6ff; }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    .toc {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px 28px;
      margin-bottom: 32px;
    }
    .toc h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: #e6edf3;
    }
    .toc ul {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 4px 16px;
    }
    .toc li a {
      color: #58a6ff;
      text-decoration: none;
      font-size: 0.88rem;
      display: block;
      padding: 3px 0;
    }
    .toc li a:hover { text-decoration: underline; }
    .content h1, .content h2, .content h3 {
      color: #e6edf3;
      margin: 24px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #21262d;
    }
    .content h1 { font-size: 1.8rem; border-bottom-width: 1px; border-color: #30363d; }
    .content h2 { font-size: 1.4rem; }
    .content h3 { font-size: 1.15rem; border-bottom: none; }
    .content h4 { font-size: 1.05rem; margin: 20px 0 10px; color: #e6edf3; }
    .content p { margin: 8px 0; }
    .content a { color: #58a6ff; text-decoration: none; }
    .content a:hover { text-decoration: underline; }
    .content ul, .content ol { padding-left: 24px; margin: 8px 0; }
    .content li { margin: 4px 0; }
    .content code {
      background: #343941;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .content pre {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 12px 0;
    }
    .content pre code { background: none; padding: 0; }
    .content blockquote {
      border-left: 3px solid #58a6ff;
      margin: 12px 0;
      padding: 8px 16px;
      color: #8b949e;
      background: #161b22;
      border-radius: 0 6px 6px 0;
    }
    .content img { max-width: 100%; border-radius: 6px; }
    .content strong { color: #e6edf3; }
    .content table { width: 100%; border-collapse: collapse; margin: 12px 0; }
    .content th, .content td { text-align: left; padding: 8px 12px; border: 1px solid #30363d; }
    .content th { background: #161b22; color: #e6edf3; }
    .scroll-top {
      position: fixed;
      bottom: 30px; right: 30px;
      width: 40px; height: 40px;
      background: #1f6feb; color: #fff;
      border: none; border-radius: 50%;
      cursor: pointer; font-size: 1.1rem;
      opacity: 0; transition: opacity 0.3s;
      pointer-events: none;
      box-shadow: 0 4px 12px rgba(31,111,235,0.4);
      display: flex; align-items: center; justify-content: center;
    }
    .scroll-top.visible { opacity: 1; pointer-events: auto; }
    .scroll-top:hover { background: #388bfd; }
    footer {
      text-align: center;
      padding: 40px 24px;
      color: #484f58;
      font-size: 0.85rem;
      border-top: 1px solid #21262d;
    }
    @media (max-width: 640px) {
      .header-inner h1 { font-size: 1rem; }
      .toc ul { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="header-left">
        <h1 id="header-title">Build Your Own X</h1>
        <div class="lang-switch">
          <button id="btn-zh" onclick="switchLang('zh')">中</button>
          <button id="btn-en" class="active" onclick="switchLang('en')">EN</button>
        </div>
      </div>
      <a class="gh-link" href="https://github.com/codecrafters-io/build-your-own-x" target="_blank">GitHub</a>
    </div>
  </header>
  <main>
    <nav class="toc">
      <h2 id="toc-title">Table of Contents</h2>
      <ul id="toc-list"></ul>
    </nav>
    <div class="content" id="content"></div>
  </main>
  <button class="scroll-top" id="scrollTop" title="Back to top">&#8593;</button>
  <footer>
    Original by <a href="https://github.com/codecrafters-io/build-your-own-x" target="_blank" style="color:#58a6ff;">codecrafters-io/build-your-own-x</a>
  </footer>

  <script type="text/markdown" id="readme-en">

  <script src="data-en.js"></script>
  <script src="data-zh.js"></script>

  <script>
    let currentLang = 'en';

    function detectLang() {
      var nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      return nav.startsWith('zh') ? 'zh' : 'en';
    }

    function switchLang(lang) {
      currentLang = lang;
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
      document.getElementById('header-title').textContent = lang === 'zh' ? '从零构建你感兴趣的技术' : 'Build Your Own X';
      document.getElementById('toc-title').textContent = lang === 'zh' ? '目录' : 'Table of Contents';
      render();
    }

    function translateIntro(md) {
      md = md.replace(/## Build your own.*\n/, '## 从零构建 &lt;insert-technology-here&gt;\n');
      md = md.replace(/This repository is a compilation.*from scratch\./, '本仓库汇集了一系列高质量的、循序渐进的技术指南，教你从零开始重新创造我们喜爱的技术。');
      md = md.replace(/> \*What I cannot create, I do not understand — Richard Feynman\.\*/, '> *"凡我不能创造的，我就不能理解。" —— 理查德·费曼*');
      md = md.replace(/It's a great way to learn\./, '这是绝佳的学习方式。');
      return md;
    }

    function buildTOC(headings) {
      var toc = document.getElementById('toc-list');
      toc.innerHTML = '';
      headings.forEach(function (h) {
        var text = h.textContent.trim();
        var id = text.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, '-').replace(/(^-|-$)/g, '');
        h.id = id;
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = '#' + id;
        a.textContent = text;
        li.appendChild(a);
        toc.appendChild(li);
      });
    }

    function render() {
      var introMd = document.getElementById('readme-en').textContent;
      var tutorialData = currentLang === 'zh' ? DATA_ZH : DATA_EN;
      if (currentLang === 'zh') {
        introMd = translateIntro(introMd);
      }
      var fullMd = introMd + '\n\n' + tutorialData;
      document.getElementById('content').innerHTML = marked.parse(fullMd);
      buildTOC(document.querySelectorAll('.content h4'));
    }

    currentLang = detectLang();
    switchLang(currentLang);

    window.addEventListener('scroll', function () {
      document.getElementById('scrollTop').classList.toggle('visible', window.scrollY > 400);
    });
  </script>
</body>
</html>
